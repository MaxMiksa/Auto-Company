<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <style>@view-transition { navigation: auto; }</style>
    <script src="/navigation.js"></script>
    <title>Auto Company · 产品</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/design-system.css">
    <link rel="stylesheet" href="/center.css">
    <script src="/center-i18n.js" defer></script>
    <script src="/icons.js" defer></script>
    <script src="/date-time.js" defer></script>
    <link rel="stylesheet" href="/ui-assets/ui.css">
    <script src="/ui-assets/ui.js" defer></script>
    <script src="/center.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#centerMain" data-i18n="skip">跳至产品列表</a>
    <div class="app-frame">
    <header class="center-header">
      <div class="header-inner">
        <a class="brand" href="/center"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15 6 18m4-5 3 3c4-2 6-6 6-11-5 0-9 2-11 6l3 3Z"/><circle cx="15" cy="9" r="1.5"/><path d="m8 10-4 1 1 4 3-1m6 2-1 4-4-1 1-3M4 20l3-1-2-2-1 3Z"/></svg></span>AUTO COMPANY</a>

        <button id="settingsButton" class="header-button" type="button"><span data-icon="settings" aria-hidden="true"></span><span data-i18n="settings">设置</span></button>
        <button id="profileButton" class="profile-button" type="button" aria-haspopup="dialog" aria-controls="settingsDialog" data-i18n-aria="localWorkspace" aria-label="本机"><span class="profile-avatar" aria-hidden="true" data-i18n="localInitial">本</span><span data-i18n="localWorkspace">本机</span><span class="profile-chevron" data-icon="chevron-down" aria-hidden="true"></span></button>
      </div>
    </header>

    <main id="centerMain" class="center-main" tabindex="-1">
      <div id="connectionNotice" class="connection-notice" role="alert" hidden></div>
      <div id="actionError" class="inline-notice error" role="alert" hidden></div>
      <p id="searchStatus" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
      <div class="center-toolbar">
        <div class="visually-hidden">
          <h1 id="pageTitle" data-i18n="products">产品</h1>
        </div>

        <div class="catalog-tools">
          <label class="search-field" for="productSearch">
            <span class="visually-hidden" data-i18n="searchProducts">搜索产品</span>
            <span data-icon="search" aria-hidden="true"></span>
            <input id="productSearch" type="search" autocomplete="off" data-i18n-placeholder="searchProducts" placeholder="搜索产品">
          </label>
          <div class="filter-summary-row">
            <div id="filters" class="filters" role="group" aria-label="筛选产品" data-i18n-aria="filterProducts">
              <button type="button" class="filter-button" data-filter="all" aria-pressed="true"><span data-i18n="filterAll">全部</span></button>
              <button type="button" class="filter-button" data-filter="running" aria-pressed="false"><span data-i18n="filterRunning">正在工作</span></button>
              <button type="button" class="filter-button" data-filter="queued" aria-pressed="false"><span data-i18n="filterQueued">已排队</span></button>
              <button type="button" class="filter-button" data-filter="attention" aria-pressed="false"><span data-i18n="filterAttention">需要处理</span></button>
              <button type="button" class="filter-button" data-filter="archived" aria-pressed="false"><span data-i18n="filterArchived">归档</span></button>
            </div>

          </div>
        </div>
        <div class="toolbar-actions">
          <div class="intro-actions">
            <button id="newWorkButton" class="button primary" type="button"><span data-icon="plus" aria-hidden="true"></span> <span data-i18n="newWork">新建工作</span></button>
            <p id="newWorkUnavailable" class="disabled-reason" role="status" hidden></p>
            <button id="importButton" class="button secondary" type="button" data-i18n="importProduct">接入已有产品</button>
          </div>
        </div>
      </div>
      <div class="center-layout">
      <section class="catalog" aria-labelledby="catalogHeading">
        <h2 id="catalogHeading" class="visually-hidden" data-i18n="productList">产品列表</h2>
        <div class="product-table">
          <div id="productRows"></div>
        </div>
        <div id="listState" class="list-state" role="status"></div>

      </section>
      <aside class="queue-sidebar" aria-labelledby="queueSidebarTitle">
        <div class="queue-sidebar-heading">
          <h2 id="queueSidebarTitle"><span data-i18n="queue">工作队列</span><span id="queueSidebarCount"></span></h2>
          <button id="queueNavButton" class="more-button" type="button" aria-controls="queueDrawer" aria-expanded="false" data-i18n-aria="queueControls" aria-label="管理队列"><span data-icon="ellipsis-vertical" aria-hidden="true"></span><span id="queueNavCount" class="visually-hidden" hidden></span></button>
        </div>
        <p id="capacitySummary" class="capacity-summary" role="status"></p>
        <div id="queueSidebarContent"></div>
      </aside>
      </div>
    </main>
    </div>

    <aside id="queueDrawer" class="queue-drawer" role="dialog" aria-modal="true" aria-labelledby="queueTitle" aria-hidden="true" tabindex="-1">
      <div class="drawer-header">
        <h2 id="queueTitle" data-i18n="queue">工作队列</h2>
        <button id="closeQueueButton" class="icon-button" type="button" aria-label="关闭" data-i18n-aria="close"><span data-icon="x" aria-hidden="true"></span></button>
      </div>
      <div class="queue-control">
        <div>
          <strong id="dispatchLabel"></strong>
          <p id="dispatchHint"></p>
        </div>
        <button id="dispatchButton" class="button secondary" type="button"></button>
      </div>
      <form id="capacityForm" class="capacity-control">
        <label><span data-i18n="concurrency">同时运行项目数</span><input name="capacity" type="number" min="1" value="4" required></label>
        <label class="radio-row"><input name="unlimited" type="checkbox"><span data-i18n="unlimited">不限</span></label>
        <button class="button secondary" type="submit" data-i18n="apply">应用</button>
        <p class="capacity-hint" data-i18n="capacityHint">调低数量不会打断运行中的项目。持续运行的项目可能让后续任务一直等待。</p>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
      <div id="queueContent" class="queue-content"></div>
      <div class="drawer-footer">
        <button id="stopAllButton" class="text-button danger" type="button" data-i18n="stopAll">全部停止</button>
        <small id="stopAllReason" class="disabled-reason"></small>
        <button id="queueHistoryButton" class="text-link button-link" type="button" data-i18n="viewHistory">查看历史请求</button>
      </div>
    </aside>

    <dialog id="newWorkDialog" aria-labelledby="newWorkTitle">
      <form id="newWorkForm" method="dialog" class="dialog-form">
        <header class="dialog-header"><div><h2 id="newWorkTitle" data-i18n="newWork">新建工作</h2><p data-i18n="workGroupsIntro">每组使用独立配置，可创建多个项目。</p></div><button class="icon-button dialog-close" type="button" aria-label="关闭" data-i18n-aria="close"><span data-icon="x" aria-hidden="true"></span></button></header>
        <div class="work-layout">
          <aside class="work-group-sidebar">
            <h3 id="workGroupsTitle" data-i18n="workGroupsTitle">配置组</h3>
            <div id="workGroupTabs" role="tablist" aria-labelledby="workGroupsTitle" aria-orientation="vertical"></div>
            <button id="addWorkGroup" class="text-button" type="button"><span data-icon="plus" aria-hidden="true"></span> <span data-i18n="workAddGroup">添加配置组</span></button>
          </aside>
          <div id="workGroups">
            <section class="work-group" role="tabpanel">
              <div class="work-group-toolbar">
                <div class="template-controls"></div>
                <button type="button" class="text-button remove-group" data-i18n="removeGroup">移除此组</button>
              </div>
              <div class="form-grid">
                <label><span data-i18n="workEngine">执行引擎</span><select name="engine"><option value="codex">codex</option><option value="claude">claude</option><option value="cursor">cursor</option><option value="openai-compatible">openai-compatible</option></select></label>
                <label><span data-i18n="productLanguage">产品语言</span><select name="productLanguage"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
                <label><span data-i18n="model">模型</span><input name="model" maxlength="200" autocomplete="off" data-i18n-placeholder="workDefaultModel" placeholder="沿用引擎默认模型"></label>
                <label><span data-i18n="reasoning">推理强度</span><select name="effort"><option value="none">none</option><option value="minimal">minimal</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option><option value="xhigh">xhigh</option><option value="max">max</option><option value="ultra">ultra</option></select></label>
              </div>
              <div class="work-count-row"><label><span data-i18n="projectCount">项目数量</span><input name="count" type="number" min="1" max="100" value="1" required><small class="disabled-reason" data-i18n="readonlyCountHint">项目数量为 1–100。</small></label><div class="work-count-actions"><button type="button" data-count-step="-1" data-i18n-aria="workDecrease" aria-label="减少项目数量"><span data-icon="minus" aria-hidden="true"></span></button><button type="button" data-count-step="1" data-i18n-aria="workIncrease" aria-label="增加项目数量"><span data-icon="plus" aria-hidden="true"></span></button></div></div>
              <label class="work-direction"><span data-i18n="direction">方向（可选）</span><textarea name="direction" rows="3" maxlength="1000" data-i18n-placeholder="workDirectionPlaceholder" placeholder="留空，由模型自主探索"></textarea></label>
              <button type="button" class="text-button save-work-template" data-i18n="workSaveTemplate">保存为模板</button>
            </section>
          </div>
        </div>
        <footer class="dialog-actions">
          <strong id="workBatchSummary" aria-live="polite"></strong>
          <fieldset class="work-execution"><legend class="visually-hidden" data-i18n="executionChoice">提交方式</legend><div class="work-execution-options"><label class="radio-row"><input type="radio" name="executionMode" value="start_now"><span data-i18n="startNow">开始运行</span></label><label class="radio-row"><input type="radio" name="executionMode" value="enqueue" checked><span data-i18n="workEnqueue">仅加入队列</span></label></div><p id="workExecutionHint"></p></fieldset>
          <div class="work-submit-actions"><button class="button secondary dialog-close" type="button" data-i18n="cancel">取消</button><button class="button primary" type="submit">创建项目</button></div>
          <p class="form-status" role="status" aria-live="polite"></p>
        </footer>
      </form>
    </dialog>

    <dialog id="continueDialog" aria-labelledby="continueTitle">
      <form id="continueForm" method="dialog" class="dialog-form">
        <header class="dialog-header"><div><p class="eyebrow" data-i18n="existingProduct">已有产品</p><h2 id="continueTitle" data-i18n="continueWork">继续工作</h2></div><button class="icon-button dialog-close" type="button" aria-label="关闭" data-i18n-aria="close"><span data-icon="x" aria-hidden="true"></span></button></header>
        <p id="continueProduct"></p>
        <div id="continueCapability" class="inline-notice" hidden></div>
        <div class="template-controls"></div>
        <div class="form-grid">
          <label><span data-i18n="engine">引擎</span><select name="engine"><option value="codex">codex</option><option value="claude">claude</option><option value="cursor">cursor</option><option value="openai-compatible">openai-compatible</option></select></label>
          <label><span data-i18n="model">模型</span><input name="model" maxlength="200" autocomplete="off"></label>
          <label><span data-i18n="reasoning">推理强度</span><select name="effort"><option value="none">none</option><option value="minimal">minimal</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option><option value="xhigh">xhigh</option><option value="max">max</option><option value="ultra">ultra</option></select></label>
          <label><span data-i18n="productLanguage">产品语言</span><input name="productLanguage" readonly></label>
        </div>
        <fieldset><legend data-i18n="executionChoice">提交方式</legend><label class="radio-row"><input type="radio" name="executionMode" value="enqueue" checked><span><strong data-i18n="addToQueue">加入队列</strong><small data-i18n="addToQueueHint">队列开启时按顺序执行</small></span></label><label class="radio-row"><input type="radio" name="executionMode" value="start_now"><span><strong data-i18n="startNow">空闲时立即开始</strong><small data-i18n="startNowHint">仅在没有活动任务或更早等待项时可用</small></span></label></fieldset>
        <p class="form-status" role="status" aria-live="polite"></p>
        <footer class="dialog-actions"><button class="button secondary dialog-close" type="button" data-i18n="cancel">取消</button><button class="button primary" type="submit" data-i18n="createRequest">安排工作</button></footer>
      </form>
    </dialog>

    <dialog id="importDialog" aria-labelledby="importTitle">
      <form id="importForm" method="dialog" class="dialog-form">
        <header class="dialog-header"><div><p class="eyebrow" data-i18n="readOnlyProbe">只读探测</p><h2 id="importTitle" data-i18n="importProduct">接入已有产品</h2></div><button class="icon-button dialog-close" type="button" aria-label="关闭" data-i18n-aria="close"><span data-icon="x" aria-hidden="true"></span></button></header>
        <p data-i18n="importIntro">先读取目录身份与能力；不会执行目录中的脚本或启动产品。</p>
        <label><span data-i18n="folderPath">目录</span><input name="root" required autocomplete="off" spellcheck="false" data-i18n-placeholder="folderPlaceholder" placeholder="输入本机目录路径"></label>
        <fieldset><legend data-i18n="connectionType">登记方式</legend><label class="radio-row"><input type="radio" name="mode" value="readonly" checked><span><strong data-i18n="readOnlyProduct">只读产品档案</strong><small data-i18n="readOnlyProductHint">保留已有产品身份与工作记录，不自动接管执行。</small></span></label><label class="radio-row"><input type="radio" name="mode" value="reference"><span><strong data-i18n="referenceOnly">仅参考源码</strong><small data-i18n="referenceOnlyHint">只登记源码与 README 摘要，不计入产品，也不可执行。</small></span></label></fieldset>
        <div id="probeResult" class="probe-result" hidden></div>
        <p class="form-status" role="status" aria-live="polite"></p>
        <footer class="dialog-actions"><button class="button secondary dialog-close" type="button" data-i18n="cancel">取消</button><button id="probeButton" class="button primary" type="submit" data-i18n="probe">检查目录</button><button id="commitImportButton" class="button primary" type="button" hidden data-i18n="confirmImport">确认接入</button></footer>
      </form>
    </dialog>

    <dialog id="sourceDialog" aria-labelledby="sourceTitle">
      <div class="dialog-form source-dialog">
        <header class="dialog-header"><div><p class="eyebrow" data-i18n="sourceManagement">来源管理</p><h2 id="sourceTitle" data-i18n="manageSources">管理来源</h2></div><button class="icon-button dialog-close" type="button" aria-label="关闭" data-i18n-aria="close"><span data-icon="x" aria-hidden="true"></span></button></header>
        <p id="sourceProduct"></p>
        <div id="sourceManagerBody"></div>
        <p id="sourceManagerStatus" class="form-status" role="status" aria-live="polite"></p>
        <footer class="dialog-actions"><button class="button secondary dialog-close" type="button" data-i18n="close">关闭</button></footer>
      </div>
    </dialog>

    <dialog id="settingsDialog" aria-labelledby="settingsTitle">
      <form id="settingsForm" method="dialog" class="dialog-form">
        <header class="dialog-header"><h2 id="settingsTitle" data-i18n="settings">设置</h2><button class="icon-button dialog-close" type="button" aria-label="关闭" data-i18n-aria="close"><span data-icon="x" aria-hidden="true"></span></button></header>
        <div class="settings-body">
          <section class="settings-section" aria-labelledby="interfaceSettingsTitle">
            <h3 id="interfaceSettingsTitle" data-i18n="interfaceSettings">界面</h3>
            <div class="settings-preferences">
              <label><span data-i18n="centerLanguage">界面语言</span><select name="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
              <div class="settings-refresh"><label class="radio-row"><input id="centerAutoRefresh" type="checkbox" checked><span data-i18n="autoRefresh">自动刷新</span></label><button id="centerRefreshButton" class="button secondary" type="button" data-i18n="retryRead">刷新</button></div>
            </div>
            <p id="observedAt" class="observed-at"></p>
          </section>
          <section class="settings-section" aria-labelledby="workDefaultsTitle">
            <h3 id="workDefaultsTitle" data-i18n="newWorkDefaults">新工作默认配置</h3>
            <p id="defaultsTemplateHint" class="disabled-reason" data-i18n="defaultsTemplateHint" hidden></p>
            <div class="template-controls"></div>
            <div class="form-grid">
              <label><span data-i18n="engine">引擎</span><select name="engine"><option value="codex">codex</option><option value="claude">claude</option><option value="cursor">cursor</option><option value="openai-compatible">openai-compatible</option></select></label>
              <label><span data-i18n="productLanguage">新产品语言</span><select name="productLanguage"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
              <label><span data-i18n="model">模型</span><input name="model" maxlength="200" autocomplete="off"></label>
              <label><span data-i18n="reasoning">推理强度</span><select name="effort"><option value="none">none</option><option value="minimal">minimal</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option><option value="xhigh">xhigh</option><option value="max">max</option><option value="ultra">ultra</option></select></label>
            </div>
          </section>
        </div>
        <p class="form-status" role="status" aria-live="polite"></p>
        <footer class="dialog-actions"><button class="button secondary dialog-close" type="button" data-i18n="cancel">取消</button><button class="button primary" type="submit" data-i18n="save">保存</button></footer>
      </form>
    </dialog>

    <dialog id="confirmDialog" aria-labelledby="confirmTitle">
      <form id="confirmForm" method="dialog" class="dialog-form compact-dialog">
        <header class="dialog-header"><h2 id="confirmTitle"></h2><button class="icon-button dialog-close" type="button" aria-label="关闭" data-i18n-aria="close"><span data-icon="x" aria-hidden="true"></span></button></header>
        <p id="confirmMessage"></p>
        <p class="form-status" role="status" aria-live="polite"></p>
        <footer class="dialog-actions"><button class="button secondary dialog-close" type="button" data-i18n="cancel">取消</button><button id="confirmActionButton" class="button primary" type="submit" data-i18n="confirm">确认</button></footer>
      </form>
    </dialog>

  </body>
</html>
