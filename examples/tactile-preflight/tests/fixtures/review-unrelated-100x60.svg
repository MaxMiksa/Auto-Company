    <rect x="24" y="27" width="6" height="6"/>
  </g>
  <circle id="independent-point-a" data-role="point" cx="50" cy="50" r="2"/>
  <circle id="independent-point-b" data-role="point" cx="55" cy="50" r="2"/>
</svg>
