name: snapog-ci

on:
  pull_request:
    paths:
      - "projects/snapog/**"
      - ".github/workflows/snapog-ci.yml"
  push:
    branches:
      - main
    paths:
      - "projects/snapog/**"
      - ".github/workflows/snapog-ci.yml"

permissions:
  contents: read

concurrency:
  group: snapog-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/snapog

jobs:
  test:
    name: Typecheck, audit, deploy dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: projects/snapog/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Audit dependencies (production)
        run: npm audit --omit=dev

      - name: Validate Worker config (wrangler deploy --dry-run)
        # No Cloudflare credentials are configured in this repo/CI. --dry-run
        # bundles the Worker and resolves wrangler.toml bindings without
        # uploading or requiring `wrangler login` — verified locally
        # (`npx wrangler deploy --dry-run --env=""`) that it needs no auth token.
        run: npx wrangler deploy --dry-run --env=""
