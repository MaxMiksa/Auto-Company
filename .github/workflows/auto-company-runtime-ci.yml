# Always start this workflow so the required CI gate can report on every PR.
name: Auto Company Runtime CI
'on':
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: auto-company-runtime-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.select.outputs.runtime }}
      browser: ${{ steps.select.outputs.browser }}
      distribution: ${{ steps.select.outputs.distribution }}
      tabledelta: ${{ steps.select.outputs.tabledelta }}
      cuecheck: ${{ steps.select.outputs.cuecheck }}
      snapog: ${{ steps.select.outputs.snapog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks from the complete Git diff
        id: select
        run: python3 scripts/ci/changes.py
  windows-config:
    name: Windows configuration contracts
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Windows PowerShell 5.1 configuration and paths
        shell: powershell
        run: |
          foreach ($test in @('start_config', 'wsl_paths', 'env_culture', 'messages', 'installation')) {
            python scripts/ci/run.py "powershell-$test" powershell -NoProfile -File "tests/test_windows_$test.ps1"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python scripts/ci/run.py powershell-install-bootstrap powershell -NoProfile -File tests/test_install_bootstrap_windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify PowerShell 7 configuration and paths
        shell: pwsh
        run: |
          foreach ($test in @('start_config', 'wsl_paths', 'env_culture', 'messages', 'installation')) {
            python scripts/ci/run.py "pwsh-$test" pwsh -NoProfile -File "tests/test_windows_$test.ps1"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python scripts/ci/run.py pwsh-install-bootstrap pwsh -NoProfile -File tests/test_install_bootstrap_windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-config-failure
          path: ci-results/
          retention-days: 14
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run standard-library test suite
        run: python3 scripts/ci/run.py python-tests-1 python3 -m unittest discover -s tests -v
      - name: Check bundled skill resource references
        run: python3 scripts/ci/run.py python-tests-2 python3 scripts/check_skill_resources.py
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-tests-failure
          path: ci-results/
          retention-days: 14
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
  macos-runtime:
    name: macOS configuration and launchd
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify configuration preservation and log rotation
        run: |
          python3 scripts/ci/run.py macos-runtime-2 bash -e -o pipefail <<'CI_SCRIPT'
          python3 -m unittest discover -s tests -p test_launchd_config.py -v
          python3 -m unittest discover -s tests -p test_daemon_installers.py -v
          python3 -m unittest discover -s tests -p test_macos_start.py -v
          python3 -m unittest discover -s tests -p test_log_rotation.py -v
          python3 -m unittest discover -s tests -p test_ui_messages.py -v
          CI_SCRIPT
      - name: Verify installer lifecycle, bootstrap, maintenance state and writer probes
        run: |
          python3 scripts/ci/run.py macos-installer python3 -m unittest -v \
            tests.test_install_manager \
            tests.test_install_bootstrap \
            tests.test_installation_state \
            tests.test_install_writer_probe
      - name: Verify Dashboard Start with a real isolated LaunchAgent
        env:
          AUTO_COMPANY_TEST_LAUNCHD: '1'
        run: python3 scripts/ci/run.py macos-runtime-3 python3 -m unittest discover -s tests -p test_launchd_installation.py -v
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-runtime-failure
          path: ci-results/
          retention-days: 14
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
  shell-syntax:
    name: Shell syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every tracked Shell file
        run: |
          python3 scripts/ci/run.py shell-syntax-1 bash -e -o pipefail <<'CI_SCRIPT'
          mapfile -d '' shell_files < <(git ls-files -z -- '*.sh')
          if (( ${#shell_files[@]} == 0 )); then
            echo "No tracked Shell files found." >&2
            exit 1
          fi
          for shell_file in "${shell_files[@]}"; do
            printf 'Checking %s\n' "$shell_file"
            bash -n -- "$shell_file"
          done
          CI_SCRIPT
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shell-syntax-failure
          path: ci-results/
          retention-days: 14
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
  shell-contracts:
    name: Shell runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify executable entrypoints and safe startup failure
        run: python3 scripts/ci/run.py shell-contracts-1 bash tests/test-shell-entrypoints.sh
      - name: Verify generated units with a real systemd user manager
        run: |
          python3 scripts/ci/run.py shell-contracts-2 bash -e -o pipefail <<'CI_SCRIPT'
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sudo systemctl start "user@$(id -u).service"
          systemctl --user show-environment > /dev/null
          AUTO_COMPANY_TEST_SYSTEMD_USER=1 python3 -m unittest discover -s tests -p test_systemd_installation.py -v
          CI_SCRIPT
      - name: Verify project and consensus governance
        run: python3 scripts/ci/run.py shell-contracts-3 bash tests/test_project_governance.sh
      - name: Verify process-tree supervision
        run: python3 scripts/ci/run.py shell-contracts-4 bash tests/test_process_supervisor.sh
      - name: Run fake-engine end-to-end cycle
        env:
          TEST_TIMEOUT_SECONDS: '45'
        run: python3 scripts/ci/run.py shell-contracts-5 bash tests/test_auto_loop_integration.sh
      - name: Verify real frontend script against deterministic API fixtures
        run: python3 scripts/ci/run.py shell-contracts-6 node tests/test_dashboard_frontend.js
      - name: Verify published example logic and syntax
        run: |
          python3 scripts/ci/run.py showcase-core node --test projects/scopefence/tests/scopefence-core.test.mjs projects/text-meter/tests/counts.test.js
          python3 scripts/ci/run.py showcase-syntax node --check projects/scope-sheet/app.js
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shell-contracts-failure
          path: ci-results/
          retention-days: 14
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
  dashboard-browser:
    name: Dashboard browser smoke
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install browser test dependencies
        run: python3 scripts/ci/run.py browser-dependencies npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
      - name: Install product screenshot dependencies
        run: python3 scripts/ci/run.py media-dependencies npm ci --prefix scripts/media --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        working-directory: tests/browser
        run: python3 ../../scripts/ci/run.py chromium-install npx playwright install --with-deps chromium
      - name: Test Dashboard with a real browser and isolated server
        run: python3 scripts/ci/run.py dashboard-browser npm test --prefix tests/browser
      - name: Verify automatic product screenshots and process cleanup
        env:
          AUTO_COMPANY_TEST_PRODUCT_MEDIA_BROWSER: '1'
        run: python3 scripts/ci/run.py product-media python3 -m unittest discover -s tests -p test_product_media.py -v
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-browser-failure
          path: |-
            ci-results/
            tests/browser/ci-results/
            tests/browser/test-results/
            tests/browser/playwright-report/
          retention-days: 14
  tabledelta:
    name: TableDelta core tests
    needs: changes
    if: needs.changes.outputs.tabledelta == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run existing core tests
        run: python3 scripts/ci/run.py tabledelta npm test --prefix projects/tabledelta
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabledelta-failure
          path: ci-results/
          retention-days: 14
  cuecheck:
    name: CueCheck core tests
    needs: changes
    if: needs.changes.outputs.cuecheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run existing core tests
        run: python3 scripts/ci/run.py cuecheck npm test --prefix projects/cuecheck
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuecheck-failure
          path: ci-results/
          retention-days: 14
  snapog:
    name: SnapOG type check
    needs: changes
    if: needs.changes.outputs.snapog == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: python3 scripts/ci/run.py snapog-dependencies npm ci --prefix projects/snapog --ignore-scripts --no-audit --no-fund
      - name: Run existing type check
        run: python3 scripts/ci/run.py snapog npm run typecheck --prefix projects/snapog
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapog-failure
          path: ci-results/
          retention-days: 14
  release-packages:
    name: Deterministic release packages
    needs: changes
    if: needs.changes.outputs.distribution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify release package contracts
        run: python3 scripts/ci/run.py release-package-tests python3 -m unittest tests.test_release_packages -v
      - name: Build the checked-out commit twice
        run: |
          python3 scripts/install/build_release.py --repo . --ref HEAD --output distribution-candidate
          python3 scripts/install/build_release.py --repo . --ref HEAD --output distribution-repeat
          diff -rq distribution-candidate distribution-repeat
      - name: Save candidate packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-candidate-${{ github.sha }}
          path: distribution-candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages-failure
          path: ci-results/
          if-no-files-found: ignore
          retention-days: 14
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - windows-config
      - python-tests
      - macos-runtime
      - shell-syntax
      - shell-contracts
      - dashboard-browser
      - tabledelta
      - cuecheck
      - snapog
      - release-packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected check to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/gate.py
