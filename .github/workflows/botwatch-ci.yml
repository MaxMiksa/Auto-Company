name: botwatch-ci

on:
  pull_request:
    paths:
      - "projects/botwatch/**"
      - ".github/workflows/botwatch-ci.yml"
  push:
    branches:
      - main
    paths:
      - "projects/botwatch/**"
      - ".github/workflows/botwatch-ci.yml"

permissions:
  contents: read

concurrency:
  group: botwatch-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/botwatch

jobs:
  test:
    name: Typecheck, test, deploy dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: projects/botwatch/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate Worker config (wrangler deploy --dry-run)
        # No Cloudflare credentials are configured in this repo/CI. --dry-run
        # bundles the Worker and resolves wrangler.toml bindings without
        # uploading or requiring `wrangler login` — verified locally
        # (`npx wrangler deploy --dry-run`) that it needs no auth token.
        run: npx wrangler deploy --dry-run
