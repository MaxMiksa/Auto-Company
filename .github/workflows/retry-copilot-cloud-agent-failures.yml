name: Retry Copilot cloud agent failures

"on":
  workflow_run:
    workflows:
      - Running Copilot cloud agent
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  rerun-once:
    # Prefer the stable Copilot GitHub App actor ID, with login fallback for compatibility.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      (
        github.event.workflow_run.actor.id == 198982749 ||
        contains(fromJSON('["Copilot","github-copilot[bot]"]'), github.event.workflow_run.actor.login)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Re-run only transient pr_summary failures
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if ! FAILED_LOGS="$(gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>&1)"; then
            echo "Failed to fetch failed logs; checking exact failed job/step shape."
            FALLBACK_FIELDS="$(gh api --paginate --slurp "/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '
              [.[].jobs[] | select((.conclusion // "") != "success" and (.conclusion // "") != "skipped" and (.conclusion // "") != "neutral")] as $failed_jobs
              | ($failed_jobs | length) as $failed_job_count
              | ($failed_jobs[0].name // "") as $failed_job_name
              | (($failed_jobs[0].steps // []) | map(select(.conclusion == "failure"))) as $failed_steps
              | [
                  ($failed_job_count | tostring),
                  (if $failed_job_count == 1 then ($failed_job_name | @base64) else "" end),
                  (if $failed_job_count == 1 then (($failed_steps | length) | tostring) else "0" end),
                  (if $failed_job_count == 1 and ($failed_steps | length) == 1 then (($failed_steps[0].name // "") | @base64) else "" end)
                ]
              | join("|")'
            )"
            IFS='|' read -r FAILED_JOB_COUNT FAILED_JOB_NAME_B64 FAILED_STEP_COUNT FAILED_STEP_NAME_B64 <<< "$FALLBACK_FIELDS"
            FAILED_JOB_NAME=""
            FAILED_STEP_NAME=""
            if [ "$FAILED_JOB_COUNT" = "1" ] && [ -n "$FAILED_JOB_NAME_B64" ]; then
              FAILED_JOB_NAME="$(printf '%s' "$FAILED_JOB_NAME_B64" | base64 --decode)"
            fi
            if [ "$FAILED_STEP_COUNT" = "1" ] && [ -n "$FAILED_STEP_NAME_B64" ]; then
              FAILED_STEP_NAME="$(printf '%s' "$FAILED_STEP_NAME_B64" | base64 --decode)"
            fi
            if [ "$FAILED_JOB_COUNT" = "1" ] && [ "$FAILED_JOB_NAME" = "copilot" ] && [ "$FAILED_STEP_COUNT" = "1" ] && [ "$FAILED_STEP_NAME" = "Processing Request (Linux)" ]; then
              gh api --method POST "/repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
              echo "Requested rerun based on exact copilot failure shape."
            else
              echo "Failed logs unavailable and failure shape did not match; not rerunning."
            fi
            exit 0
          fi
          if printf '%s' "$FAILED_LOGS" | grep -Fq "Failed to send pr_summary after 3 attempts"; then
            gh api --method POST "/repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
            echo "Requested rerun for transient pr_summary failure."
          else
            echo "No transient pr_summary failure detected; not rerunning."
          fi
